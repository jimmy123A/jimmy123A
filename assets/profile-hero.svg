<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Dimitris Dimopoulos</title>
  <desc id="desc">Product-focused full-stack engineer building spatial, visual, and cross-platform software</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1d2d"/>
      <stop offset="1" stop-color="#073344"/>
